# fly.toml app configuration file generated for aiost on 2026-11-09T19:19:07Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "aiost"
primary_region = 'sin'

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
  processes = ['app']
  size = 'shared-cpu-1x'
